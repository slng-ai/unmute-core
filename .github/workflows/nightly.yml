name: Nightly

# The checks that need real API keys. They never run on a pull request.
# The Release workflow runs it on every tag, before anything is published.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      llm_model:
        description: The model every agent answers on
        default: gemini-3.1-flash-lite
      thinking_level:
        description: Gemini thinking level (3.8 Flash refuses MINIMAL)
        default: MINIMAL
  workflow_call:
    secrets:
      OPENAI_API_KEY:
        required: false
      GOOGLE_API_KEY:
        required: false
      SLNG_API_KEY:
        required: false
      LANGFUSE_PUBLIC_KEY:
        required: false
      LANGFUSE_SECRET_KEY:
        required: false

permissions:
  contents: read

env:
  UV_LINK_MODE: copy

jobs:
  # Model trial (try/models only): whole scripted calls on the chosen model, two attempts each.
  scenarios:
    name: scenarios live (${{ matrix.example }}, ${{ matrix.framework }}, ${{ matrix.attempt }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [kestrel, wasla, nosh, faro]
        framework: [livekit, pipecat]
        attempt: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: scripts/converse-examples.sh examples/${{ matrix.example }}/${{ matrix.framework }}
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SLNG_API_KEY: ${{ secrets.SLNG_API_KEY }}
          FARO_DB: ":memory:"
          CONVERSE_TIMING: "1"
          LLM_MODEL: ${{ inputs.llm_model }}
          THINKING_LEVEL: ${{ inputs.thinking_level }}
