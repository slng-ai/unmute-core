[project]
name = "salon"
version = "0.1.0"
description = "The salon concierge agent, written once on unmute-core for LiveKit and Pipecat"
requires-python = ">=3.12"
dependencies = [
    "llama-index-embeddings-openai",
    "unmute-core[knowledge]",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

# llama-index-retrievers-bm25 pins pystemmer<3, which has no linux aarch64 wheel.
# 3.1.0 has wheels everywhere. Same override as Unmute's emitted projects.
[tool.uv]
override-dependencies = ["pystemmer>=3.1.0,<4"]

[tool.uv.sources]
unmute-core = { path = "../../..", editable = true }

[dependency-groups]
dev = ["pytest>=9", "ruff==0.15.7", "ty"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PERF", "FURB", "RUF", "BLE", "D", "ANN"]
ignore = ["E501", "ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]

[tool.ty.environment]
python-version = "3.12"
