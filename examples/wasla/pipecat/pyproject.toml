[project]
name = "wasla-pipecat"
version = "0.1.0"
description = "Wasla on Pipecat, on unmute-core"
requires-python = ">=3.12"
dependencies = [
    "wasla",
    "python-dotenv",
    "voice-stack[pipecat]",
]

[tool.uv]
package = false

[tool.uv.sources]
wasla = { path = "../wasla", editable = true }
voice-stack = { path = "../../voice-stack", editable = true }
unmute-core = { path = "../../..", editable = true }

[dependency-groups]
dev = ["ruff==0.15.7", "ty"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PERF", "FURB", "RUF", "BLE", "D", "ANN"]
ignore = ["E501", "ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.environment]
python-version = "3.12"
