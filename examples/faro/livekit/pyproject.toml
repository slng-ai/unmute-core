[project]
name = "faro-livekit"
version = "0.1.0"
description = "Faro on LiveKit Agents, on unmute-core"
requires-python = ">=3.12"
dependencies = [
    "faro",
    "python-dotenv",
    "voice-stack[livekit]",
]

[tool.uv]
package = false

[tool.uv.sources]
faro = { path = "../faro", editable = true }
voice-stack = { path = "../../voice-stack", editable = true }
unmute-core = { path = "../../..", editable = true }

[dependency-groups]
dev = ["ruff==0.15.7", "ty"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PERF", "FURB", "RUF", "BLE", "D", "ANN"]
ignore = ["E501", "ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.environment]
python-version = "3.12"
